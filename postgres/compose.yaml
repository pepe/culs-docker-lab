name: eied5e-postgres
services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: teaching
      POSTGRES_USER: teacher
      POSTGRES_PASSWORD: TeachingOnly2026
    ports:
    - 127.0.0.1:5432:5432
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U teacher -d teaching
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
  adminer:
    image: adminer:5
    profiles:
    - web
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
    - 127.0.0.1:8080:8080
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data: {}
