name: eied5e-lab
services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: teaching
      POSTGRES_USER: teacher
      POSTGRES_PASSWORD: TeachingOnly2026
    ports:
    - 127.0.0.1:5432:5432
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U teacher -d teaching
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/TeachingOnly2026
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
    - 127.0.0.1:7474:7474
    - 127.0.0.1:7687:7687
    volumes:
    - neo4j_data:/data
    healthcheck:
      test:
      - CMD-SHELL
      - cypher-shell -u neo4j -p TeachingOnly2026 -d neo4j "RETURN 1;" >/dev/null
        2>&1
      interval: 10s
      timeout: 10s
      retries: 24
      start_period: 30s
  adminer:
    image: adminer:5
    profiles:
    - web
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
    - 127.0.0.1:8080:8080
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data: {}
  neo4j_data: {}
